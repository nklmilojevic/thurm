[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
thurm-proto = { path = "crates/thurm-proto" }
thurm-config = { path = "crates/thurm-config" }
thurm-term = { path = "crates/thurm-term" }
thurm-client = { path = "crates/thurm-client" }
thurm-remote = { path = "crates/thurm-remote" }
thurm-ssh = { path = "crates/thurm-ssh" }
thurm-mosh = { path = "crates/thurm-mosh" }
thurm-direct = { path = "crates/thurm-direct" }
thurm-tailnet-client = { path = "crates/thurm-tailnet-client" }
# libghostty-vt (Ghostty's terminal engine): prebuilt for the shipped targets, no Zig needed.
ghostty-vt-rs-sys = "0.1.1"
bitflags = "2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1.1", features = ["use-std"] }
toml = "1.0"
serde_ignored = "0.1"
toml_edit = "0.25"
dirs = "7"
flate2 = "1"
png = "0.18"
base64 = "0.23"
qrcode = { version = "0.14", default-features = false }
regex = "1"
libc = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
# std::time::Instant on native; the browser clock on wasm32, where std's panics.
web-time = "1"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
signal-hook = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

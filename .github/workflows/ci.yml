name: CI

on:
  # Branches are tested through their pull request; pushes only on main (Release follows it).
  push:
    branches: [main]
  pull_request:

# Read-only everywhere: CI only builds and tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request replaces its run; every commit on main runs to the end (Release
# builds from commits that passed there).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit (the tag it was taken from is in the comment).
#
# A pull request runs the tests of what it changes; main runs everything (Release builds from
# commits that passed there).
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      release-scripts: ${{ steps.diff.outputs.release-scripts }}
      app-icon: ${{ steps.diff.outputs.app-icon }}
      docs: ${{ steps.diff.outputs.docs }}
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The pull request's merge commit against its base: what it changes. A rename counts
          # for both paths, and a failed diff fails the job rather than skipping every suite.
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --no-renames --name-only "$BASE" HEAD)"
          fi
          area() {
            if [[ "$EVENT" != pull_request ]] || grep -Eq "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi >> "$GITHUB_OUTPUT"
          }
          # Everything the crates build, embed or test with, and this workflow.
          rust='crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|shell-integration/|completions/|skills/|licenses/|config\.example\.toml$|macos/Resources/fonts/|scripts/third-party-licenses\.py$|\.github/workflows/ci\.yml$'
          area rust "^($rust)"
          area release-scripts '^(macos/build\.sh$|macos/compile-icon\.sh$|macos/package-dmg\.sh$|macos/release/|\.github/workflows/ci\.yml$)'
          area app-icon '^(macos/Resources/AppIcon\.icon/|macos/compile-icon\.sh$|macos/build\.sh$|\.github/workflows/ci\.yml$)'
          area docs '^(docs/|config\.example\.toml$|\.github/workflows/ci\.yml$)'
          area go '^(tailnet/|scripts/third-party-licenses\.py$|\.github/workflows/ci\.yml$)'
          area web '^(web/|crates/thurm-(web|term|proto|config)/|tailnet/internal/(web|gateway|node)/|tailnet/cmd/thurm-(webtest|tailnet)/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/build-web\.sh$|\.github/workflows/ci\.yml$)'
          cat "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          targets: aarch64-apple-ios, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # thurm-mosh's and thurm-direct's tests talk to a real mosh-server (skipped without one).
      - name: Install mosh
        run: brew install mosh
      # --locked: a dependency change must come with its Cargo.lock.
      - name: Test
        run: cargo test --workspace --locked
      # The iOS app's core: catches desktop-only code (process spawning, Linux-only libc) leaking in.
      - name: iOS core
        run: cargo clippy -p thurm-ffi --target aarch64-apple-ios --no-default-features --features mobile --locked -- -D warnings
      # The browser client's: the shared config and protocol crates build for wasm32 too.
      - name: wasm core
        run: cargo clippy -p thurm-config -p thurm-proto --target wasm32-unknown-unknown --locked -- -D warnings
      # Not committed (the builds generate it), but a broken generator should fail here, not at release.
      - name: Third-party licenses
        run: python3 scripts/third-party-licenses.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    # The tests of what thurmd and thurm do on Linux remote hosts, on x86_64 only. Release
    # builds and checks the shipped static binaries for both architectures.
    name: Linux
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    # The same image as Release's Linux builds. Privileged for the network namespace test.
    container:
      image: ubuntu:24.04
      options: --privileged
    defaults:
      run:
        # A container's default shell is sh.
        shell: bash
    # The image has no locale set, unlike the hosted runners the tests were written on.
    env:
      LANG: C.UTF-8
      TARGET: x86_64-unknown-linux-musl
    steps:
      # git first: the checkout must be a repository.
      - name: Build dependencies, musl and sshd
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            xz-utils zstd python3 musl-tools openssh-server openssh-client
          # sshd's privilege separation directory, which its service makes on a host.
          mkdir -p /run/sshd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: x86_64-unknown-linux-musl
      # The daemon and terminal suites, and the remote ones (loopback ssh, handoffs). Here sshd
      # is there, and so is the network namespace in a privileged container, so the tests
      # needing them must not skip.
      - name: Test
        env:
          THURM_REQUIRE_SSHD: "1"
          THURM_REQUIRE_NETNS: "1"
        run: cargo test --locked --target "$TARGET" -p thurm-daemon -p thurm-term -p thurm-remote -p thurm-cli

  go:
    # The Tailscale helper (tailnet/, thurm-tailnet), with the Go version from its go.mod.
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tailnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: |
            tailnet/go.sum
            tailnet/e2e/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # The node dialing a peer for this machine, against Tailscale's in-process coordination
      # server: a module of its own, so tailscale.com/tstest's dependencies stay out of the
      # helper's.
      - name: End to end
        working-directory: tailnet/e2e
        run: |
          go vet ./...
          go test -race ./...
      # The helper ships as a static binary next to thurmd.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/thurm-tailnet
      # The macOS app's THIRD_PARTY_LICENSES lists the modules it links (cargo metadata too).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Third-party licenses
        working-directory: .
        run: python3 scripts/third-party-licenses.py --with-go

  web:
    # The browser client: its wasm core, the bundle thurm-tailnet embeds, and what the end-to-end
    # tests run against.
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web
      # wasm-bindgen and wasm-opt from the flake's nixpkgs: the dev shell's versions, the
      # wasm-bindgen one being the version thurm-web pins.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - name: wasm core
        run: |
          cargo clippy -p thurm-web -p thurm-term -p thurm-config -p thurm-proto --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test -p thurm-web --locked
      # Fails past the size budget (specs/web.md: under 1 MB compressed).
      - name: Bundle
        env:
          THURM_WEB_BUDGET_KIB: "700"
        run: nix shell --inputs-from . nixpkgs#wasm-bindgen-cli nixpkgs#binaryen -c scripts/build-web.sh
      - name: Types and unit tests
        working-directory: web
        run: |
          bunx tsc --noEmit
          bun test src
      - name: Serving the bundle
        working-directory: tailnet
        run: go test ./internal/web/ ./internal/gateway/
      - name: Daemon and CLI
        run: cargo build --locked -p thurm-daemon -p thurm-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-e2e
          path: |
            target/debug/thurmd
            target/debug/thurm
            tailnet/internal/web/dist/
          retention-days: 1

  web-e2e:
    # The page against a real thurmd (Playwright, Chromium and WebKit), in Playwright's image:
    # the browsers and the libraries WebKit needs come with it rather than from apt on every
    # run. Its tag follows @playwright/test in web/package.json, and its Ubuntu the runner the
    # binaries are built on.
    name: Web end to end
    needs: web
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      # Pinned to the tag's digest: a moved tag must not change what runs here.
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:d89d0e4a7058330a8334306a5aef1e00807863d31af27cf11348eed696d6e0ba
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The checkout belongs to the runner's user, not the container's root, so Git (and with
      # it the Go VCS stamping in the harness's gateway build) refuses it. actions/checkout trusts
      # it only in a temporary HOME of its own.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # setup-bun unpacks with unzip, which the image lacks.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The harness builds the thurm-webtest gateway.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-e2e
      # Artifacts drop the executable bit.
      - run: chmod +x target/debug/thurmd target/debug/thurm
      - name: End to end
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  checks:
    name: Consistency and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ghostty-vt-rs-sys pins the Ghostty commit (build.rs) and its prebuilt archives
      # (prebuilt.rs). The Nix package repeats the archives it fetches (nix/ghostty-vt.nix).
      - name: One Ghostty commit
        run: |
          set -euo pipefail
          crate="$(dirname "$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "ghostty-vt-rs-sys") | .manifest_path')")"
          commit="$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";/\1/p' "$crate/build.rs")"
          prebuilt_commit="$(sed -n 's/^const PREBUILT_COMMIT: &str = "\([0-9a-f]*\)";/\1/p' "$crate/prebuilt.rs")"
          nix_commit="$(sed -n 's/^ *commit = "\([0-9a-f]*\)";/\1/p' nix/ghostty-vt.nix)"
          echo "ghostty-vt-rs-sys: $commit (prebuilt archives: ${prebuilt_commit:-none})"
          echo "nix/ghostty-vt.nix: $nix_commit"
          # The sums below only mean something for archives built from the crate's commit.
          [[ -n "$commit" && "$commit" == "$prebuilt_commit" && "$commit" == "$nix_commit" ]] || {
            echo "::error::ghostty-vt-rs-sys's prebuilt archives or nix/ghostty-vt.nix are not at its Ghostty commit"
            exit 1
          }
          awk -F'"' '/triple = / { t = $2 } /sha256 = / { print t, $2 }' nix/ghostty-vt.nix | while read -r triple sum; do
            grep -qF "(\"$triple\", \"$sum\")" "$crate/prebuilt.rs" || {
              echo "::error::nix/ghostty-vt.nix: $triple's sha256 is not ghostty-vt-rs-sys's"
              exit 1
            }
          done
      # The Rust version is pinned in rust-toolchain.toml and repeated in every workflow. A
      # dtolnay/rust-toolchain step without a toolchain input gets its ref's default, stable.
      - name: One Rust toolchain
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "rust-toolchain.toml: $pin"
          [[ -n "$pin" ]]
          awk -v pin="$pin" '
            function end_step() {
              if (open && !pinned) { print step ": no toolchain input"; bad = 1 }
              open = 0
            }
            FNR == 1 { end_step() }
            /^ *- / { match($0, /^ */); if (open && RLENGTH <= indent) end_step() }
            /uses: dtolnay\/rust-toolchain@/ {
              end_step(); open = 1; pinned = 0; step = FILENAME ":" FNR
              match($0, /^ */); indent = RLENGTH
            }
            /^ *toolchain:/ {
              v = $0; sub(/^ *toolchain: */, "", v)
              if (v == pin) pinned = 1; else { print FILENAME ":" FNR ": toolchain " v; bad = 1 }
            }
            END { end_step(); exit bad }
          ' .github/workflows/*.yml .github/workflows/*.yaml || {
            echo "::error::every dtolnay/rust-toolchain step must pin rust-toolchain.toml's version"
            exit 1
          }
      # Go is pinned in tailnet/go.mod; the dev shell's go_1_<minor> must be that minor version.
      - name: One Go version
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^go \([0-9]*\.[0-9]*\)\.[0-9]*$/\1/p' tailnet/go.mod)"
          nix_pin="$(sed -n 's/^ *go_\([0-9]*\)_\([0-9]*\)$/\1.\2/p' flake.nix)"
          echo "tailnet/go.mod: $pin"
          echo "flake.nix: $nix_pin"
          [[ -n "$pin" && "$pin" == "$nix_pin" ]] || {
            echo "::error::tailnet/go.mod and flake.nix's dev shell pin different Go versions"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      # A release binary, checked by the action, rather than compiling cargo-audit every run.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: Dependency advisories
        run: cargo audit

  release-scripts:
    name: Release scripts
    needs: changes
    if: needs.changes.outputs.release-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/compile-icon.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  app-icon:
    # The Icon Composer icon is compiled with Xcode's actool, which only macOS has.
    name: App icon
    needs: changes
    if: needs.changes.outputs.app-icon == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile
        run: macos/compile-icon.sh "$RUNNER_TEMP/Resources"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # astro build runs on node; the runner image's can lag astro's engines floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build

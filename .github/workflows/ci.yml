name: CI

on:
  # Branches are tested through their pull request; pushes only on main (Release follows it).
  push:
    branches: [main]
  pull_request:

# Read-only everywhere: CI only builds and tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request replaces its run; every commit on main runs to the end (Release
# builds from commits that passed there).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit (the tag it was taken from is in the comment).
#
# A pull request runs the tests of what it changes; main runs everything (Release builds from
# commits that passed there, and builds the packages itself).
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      linux-app: ${{ steps.diff.outputs.linux-app }}
      release-scripts: ${{ steps.diff.outputs.release-scripts }}
      app-icon: ${{ steps.diff.outputs.app-icon }}
      docs: ${{ steps.diff.outputs.docs }}
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The pull request's merge commit against its base: what it changes. A rename counts
          # for both paths, and a failed diff fails the job rather than skipping every suite.
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --no-renames --name-only "$BASE" HEAD)"
          fi
          area() {
            if [[ "$EVENT" != pull_request ]] || grep -Eq "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi >> "$GITHUB_OUTPUT"
          }
          # Everything the crates build, embed or test with, and this workflow.
          rust='crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|shell-integration/|completions/|skills/|licenses/|config\.example\.toml$|macos/Resources/fonts/|scripts/third-party-licenses\.py$|scripts/linux/smoke|\.github/workflows/ci\.yml$'
          area rust "^($rust)"
          # The Linux app also reads the icons and data in linux/ when run from the checkout.
          area linux-app "^($rust|linux/(share|icons)/)"
          area release-scripts '^(macos/build\.sh$|macos/compile-icon\.sh$|macos/package-dmg\.sh$|macos/release/|\.github/workflows/ci\.yml$)'
          area app-icon '^(macos/Resources/AppIcon\.icon/|macos/compile-icon\.sh$|macos/build\.sh$|\.github/workflows/ci\.yml$)'
          area docs '^(docs/|config\.example\.toml$|\.github/workflows/ci\.yml$)'
          area go '^(tailnet/|scripts/third-party-licenses\.py$|\.github/workflows/ci\.yml$)'
          cat "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # thurm-mosh's and thurm-direct's tests talk to a real mosh-server (skipped without one).
      - name: Install mosh
        run: brew install mosh
      # --locked: a dependency change must come with its Cargo.lock.
      - name: Test
        run: cargo test --workspace --locked
      # The iOS app's core: catches desktop-only code (process spawning, Linux-only libc) leaking in.
      - name: iOS core
        run: cargo clippy -p thurm-ffi --target aarch64-apple-ios --no-default-features --features mobile --locked -- -D warnings
      # Not committed (the builds generate it), but a broken generator should fail here, not at release.
      - name: Third-party licenses
        run: python3 scripts/third-party-licenses.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    # Remote hosts run the static musl builds of thurm and thurmd (remote workspaces).
    name: Linux (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            home: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            home: false
    # Pushes to main run x86_64 on the self-hosted runner (home-x64, container jobs only); pull
    # requests never run there.
    runs-on: ${{ github.event_name != 'pull_request' && matrix.home && 'home-x64' || matrix.runner }}
    # The same container on every runner, so the caches main saves are the ones pull requests
    # restore. Privileged on the hosted runners for the network namespace test; the self-hosted
    # runner can't be, and skips it.
    container:
      image: ubuntu:24.04
      options: ${{ (github.event_name == 'pull_request' || !matrix.home) && '--privileged' || '' }}
    defaults:
      run:
        # A container's default shell is sh.
        shell: bash
    # The image has no locale set, unlike the hosted runners the tests were written on.
    env:
      LANG: C.UTF-8
    steps:
      # git first: the checkout must be a repository.
      - name: Build dependencies, musl and sshd
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            xz-utils zstd file python3 musl-tools openssh-server openssh-client
          # sshd's privilege separation directory, which its service makes on a host.
          mkdir -p /run/sshd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}
      # The shipped static binaries: main only (pull requests run the tests below).
      - name: Build
        if: github.event_name == 'push'
        run: cargo build --release --locked --target ${{ matrix.target }} -p thurm-cli -p thurm-daemon
      - name: Static
        if: github.event_name == 'push'
        run: |
          for b in thurm thurmd; do
            file "target/${{ matrix.target }}/release/$b"
            file "target/${{ matrix.target }}/release/$b" | grep -Eq 'statically linked|static-pie linked'
          done
      # The daemon and terminal suites, and the remote ones (loopback ssh, handoffs). Here sshd
      # is there, and so is the network namespace in a privileged container, so the tests
      # needing them must not skip.
      - name: Test
        env:
          THURM_REQUIRE_SSHD: "1"
          REQUIRE_NETNS: ${{ (github.event_name == 'pull_request' || !matrix.home) && '1' || '' }}
        run: |
          if [[ -n "$REQUIRE_NETNS" ]]; then export THURM_REQUIRE_NETNS=1; fi
          cargo test --locked --target ${{ matrix.target }} -p thurm-daemon -p thurm-term -p thurm-remote -p thurm-cli

  go:
    # The Tailscale helper (tailnet/, thurm-tailnet), with the Go version from its go.mod.
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tailnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # The helper ships as a static binary next to thurmd.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/thurm-tailnet
      # The macOS app's THIRD_PARTY_LICENSES lists the modules it links (cargo metadata too).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Third-party licenses
        working-directory: .
        run: python3 scripts/third-party-licenses.py --with-go

  linux-app:
    # The Linux app (crates/thurm-gtk, GTK 4 + libadwaita), and a headless run of it.
    name: Linux app (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.linux-app == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # Pushes to main run x86_64 on the self-hosted runner (home-x64, container jobs only); pull
    # requests never run there. The same container on every runner, so the caches main saves
    # are the ones pull requests restore.
    runs-on: ${{ github.event_name != 'pull_request' && matrix.runner == 'ubuntu-24.04' && 'home-x64' || matrix.runner }}
    container: ubuntu:24.04
    defaults:
      run:
        # A container's default shell is sh.
        shell: bash
    # The image has no locale set; the smoke test types UTF-8 text (xdotool needs the locale).
    env:
      LANG: C.UTF-8
    steps:
      # git first: the checkout must be a repository.
      - name: GTK and the headless display
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            xz-utils zstd pkg-config libgtk-4-dev libadwaita-1-dev fonts-dejavu-core \
            xvfb xdotool imagemagick dbus-x11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: linux-app
      - name: Test
        run: cargo test --locked -p thurm-gtk
      - name: Clippy
        run: cargo clippy --locked -p thurm-gtk --all-targets -- -D warnings
      - name: Smoke test
        run: |
          cargo build --locked -p thurm-gtk -p thurm-daemon -p thurm-cli
          scripts/linux/smoke.sh target/debug smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-app-smoke-${{ matrix.runner }}
          path: smoke

  checks:
    name: Consistency and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ghostty-vt-rs-sys pins the Ghostty commit (build.rs) and its prebuilt archives
      # (prebuilt.rs). The Nix package repeats the archives it fetches (nix/ghostty-vt.nix), and
      # the Arch package's source build fetches that commit's Zig packages (nix/ghostty-zig-deps.nix).
      - name: One Ghostty commit
        run: |
          set -euo pipefail
          crate="$(dirname "$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "ghostty-vt-rs-sys") | .manifest_path')")"
          commit="$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";/\1/p' "$crate/build.rs")"
          prebuilt_commit="$(sed -n 's/^const PREBUILT_COMMIT: &str = "\([0-9a-f]*\)";/\1/p' "$crate/prebuilt.rs")"
          nix_commit="$(sed -n 's/^ *commit = "\([0-9a-f]*\)";/\1/p' nix/ghostty-vt.nix)"
          zig_commit="$(sed -n '1s/.*build\.zig\.zon\.nix at \([0-9a-f]*\) .*/\1/p' nix/ghostty-zig-deps.nix)"
          echo "ghostty-vt-rs-sys: $commit (prebuilt archives: ${prebuilt_commit:-none})"
          echo "nix/ghostty-vt.nix: $nix_commit"
          echo "nix/ghostty-zig-deps.nix: $zig_commit"
          # The sums below only mean something for archives built from the crate's commit.
          [[ -n "$commit" && "$commit" == "$prebuilt_commit" && "$commit" == "$nix_commit" && "$commit" == "$zig_commit" ]] || {
            echo "::error::ghostty-vt-rs-sys's prebuilt archives, nix/ghostty-vt.nix or nix/ghostty-zig-deps.nix are not at its Ghostty commit"
            exit 1
          }
          awk -F'"' '/triple = / { t = $2 } /sha256 = / { print t, $2 }' nix/ghostty-vt.nix | while read -r triple sum; do
            grep -qF "(\"$triple\", \"$sum\")" "$crate/prebuilt.rs" || {
              echo "::error::nix/ghostty-vt.nix: $triple's sha256 is not ghostty-vt-rs-sys's"
              exit 1
            }
          done
      # The Rust version is pinned in rust-toolchain.toml and repeated in every workflow. A
      # dtolnay/rust-toolchain step without a toolchain input gets its ref's default, stable.
      - name: One Rust toolchain
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "rust-toolchain.toml: $pin"
          [[ -n "$pin" ]]
          awk -v pin="$pin" '
            function end_step() {
              if (open && !pinned) { print step ": no toolchain input"; bad = 1 }
              open = 0
            }
            FNR == 1 { end_step() }
            /^ *- / { match($0, /^ */); if (open && RLENGTH <= indent) end_step() }
            /uses: dtolnay\/rust-toolchain@/ {
              end_step(); open = 1; pinned = 0; step = FILENAME ":" FNR
              match($0, /^ */); indent = RLENGTH
            }
            /^ *toolchain:/ {
              v = $0; sub(/^ *toolchain: */, "", v)
              if (v == pin) pinned = 1; else { print FILENAME ":" FNR ": toolchain " v; bad = 1 }
            }
            END { end_step(); exit bad }
          ' .github/workflows/*.yml .github/workflows/*.yaml || {
            echo "::error::every dtolnay/rust-toolchain step must pin rust-toolchain.toml's version"
            exit 1
          }
      # Go is pinned in tailnet/go.mod; the dev shell's go_1_<minor> must be that minor version.
      - name: One Go version
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^go \([0-9]*\.[0-9]*\)\.[0-9]*$/\1/p' tailnet/go.mod)"
          nix_pin="$(sed -n 's/^ *go_\([0-9]*\)_\([0-9]*\)$/\1.\2/p' flake.nix)"
          echo "tailnet/go.mod: $pin"
          echo "flake.nix: $nix_pin"
          [[ -n "$pin" && "$pin" == "$nix_pin" ]] || {
            echo "::error::tailnet/go.mod and flake.nix's dev shell pin different Go versions"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      # A release binary, checked by the action, rather than compiling cargo-audit every run.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: Dependency advisories
        run: cargo audit

  release-scripts:
    name: Release scripts
    needs: changes
    if: needs.changes.outputs.release-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/compile-icon.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  app-icon:
    # The Icon Composer icon is compiled with Xcode's actool, which only macOS has.
    name: App icon
    needs: changes
    if: needs.changes.outputs.app-icon == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile
        run: macos/compile-icon.sh "$RUNNER_TEMP/Resources"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build

name: CI

on:
  # Branches are tested through their pull request; pushes only on main (Release follows it).
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # libghostty-vt (the terminal engine) is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

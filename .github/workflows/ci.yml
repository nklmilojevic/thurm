name: CI

on:
  # Branches are tested through their pull request; pushes only on main (Release follows it).
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # libghostty-vt (the terminal engine) is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    # Remote hosts run the static musl builds of thurm and thurmd (remote workspaces).
    name: Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # libghostty-vt is cross-built for musl with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: musl and sshd
        run: sudo apt-get update && sudo apt-get install -y musl-tools openssh-server openssh-client
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p thurm-cli -p thurm-daemon
      - name: Static
        run: |
          for b in thurm thurmd; do
            file "target/${{ matrix.target }}/release/$b"
            file "target/${{ matrix.target }}/release/$b" | grep -Eq 'statically linked|static-pie linked'
          done
      # Ubuntu's AppArmor blocks unprivileged user namespaces; the port lookup is tested with
      # a listener in its own network namespace.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The daemon and terminal suites, and the remote ones (loopback ssh, handoffs).
      - name: Test
        env:
          THURM_REQUIRE_NETNS: "1"
        run: cargo test --target ${{ matrix.target }} -p thurm-daemon -p thurm-term -p thurm-remote -p thurm-cli

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

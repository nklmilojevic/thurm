name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # libghostty-vt (the terminal engine) is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt
      - run: uv run --no-project python scripts/prepare-docs.py
      - run: uv run --no-project --with-requirements requirements-docs.txt mkdocs build --strict

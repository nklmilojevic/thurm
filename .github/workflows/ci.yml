name: CI

on:
  # Branches are tested through their pull request; pushes only on main (Release follows it).
  push:
    branches: [main]
  pull_request:

# Read-only everywhere: CI only builds and tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a commit (the tag it was taken from is in the comment).
#
# A pull request runs the tests of what it changes; main runs everything (Release builds from
# commits that passed there, and builds the packages itself).
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      linux-app: ${{ steps.diff.outputs.linux-app }}
      release-scripts: ${{ steps.diff.outputs.release-scripts }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The pull request's merge commit against its base: what it changes. A rename counts
          # for both paths, and a failed diff fails the job rather than skipping every suite.
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --no-renames --name-only "$BASE" HEAD)"
          fi
          area() {
            if [[ "$EVENT" != pull_request ]] || grep -Eq "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi >> "$GITHUB_OUTPUT"
          }
          # Everything the crates build, embed or test with, and this workflow.
          rust='crates/|vendor/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|shell-integration/|completions/|skills/|licenses/|config\.example\.toml$|macos/Resources/fonts/|scripts/third-party-licenses\.py$|scripts/linux/smoke|\.github/workflows/ci\.yml$'
          area rust "^($rust)"
          # The Linux app also reads the icons and data in linux/ when run from the checkout.
          area linux-app "^($rust|linux/(share|icons)/)"
          area release-scripts '^(macos/build\.sh$|macos/package-dmg\.sh$|macos/release/|\.github/workflows/ci\.yml$)'
          area docs '^(docs/|config\.example\.toml$|\.github/workflows/ci\.yml$)'
          cat "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Thurm ships for Apple silicon only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # libghostty-vt (the terminal engine) is built from source with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      # --locked: a dependency change must come with its Cargo.lock.
      - name: Test
        run: cargo test --workspace --locked
      # Not committed (the builds generate it), but a broken generator should fail here, not at release.
      - name: Third-party licenses
        run: python3 scripts/third-party-licenses.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    # Remote hosts run the static musl builds of thurm and thurmd (remote workspaces).
    name: Linux (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      # libghostty-vt is cross-built for musl with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: musl and sshd
        run: sudo apt-get update && sudo apt-get install -y musl-tools openssh-server openssh-client
      # The shipped static binaries: main only (pull requests run the tests below).
      - name: Build
        if: github.event_name == 'push'
        run: cargo build --release --locked --target ${{ matrix.target }} -p thurm-cli -p thurm-daemon
      - name: Static
        if: github.event_name == 'push'
        run: |
          for b in thurm thurmd; do
            file "target/${{ matrix.target }}/release/$b"
            file "target/${{ matrix.target }}/release/$b" | grep -Eq 'statically linked|static-pie linked'
          done
      # Ubuntu's AppArmor blocks unprivileged user namespaces; the port lookup is tested with
      # a listener in its own network namespace.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The daemon and terminal suites, and the remote ones (loopback ssh, handoffs). Here the
      # network namespace and sshd are there, so the tests needing them must not skip.
      - name: Test
        env:
          THURM_REQUIRE_NETNS: "1"
          THURM_REQUIRE_SSHD: "1"
        run: cargo test --locked --target ${{ matrix.target }} -p thurm-daemon -p thurm-term -p thurm-remote -p thurm-cli

  linux-app:
    # The Linux app (crates/thurm-gtk, GTK 4 + libadwaita), and a headless run of it.
    name: Linux app (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.linux-app == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux-app
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: GTK and the headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev fonts-dejavu-core \
            xvfb xdotool imagemagick dbus-x11
      - name: Test
        run: cargo test --locked -p thurm-gtk
      - name: Clippy
        run: cargo clippy --locked -p thurm-gtk --all-targets -- -D warnings
      - name: Smoke test
        run: |
          cargo build --locked -p thurm-gtk -p thurm-daemon -p thurm-cli
          scripts/linux/smoke.sh target/debug smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-app-smoke-${{ matrix.runner }}
          path: smoke

  checks:
    name: Consistency and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Ghostty commit is pinned twice: for cargo builds and for the Nix package.
      - name: One Ghostty commit
        run: |
          set -euo pipefail
          cargo_pin="$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";/\1/p' vendor/libghostty-vt-sys/build.rs)"
          nix_pin="$(sed -n 's/^ *rev = "\([0-9a-f]*\)";/\1/p' flake.nix | head -n 1)"
          echo "build.rs: $cargo_pin"
          echo "flake.nix: $nix_pin"
          [[ -n "$cargo_pin" && "$cargo_pin" == "$nix_pin" ]] || {
            echo "::error::vendor/libghostty-vt-sys/build.rs and flake.nix pin different Ghostty commits"
            exit 1
          }
      # The Rust version is pinned in rust-toolchain.toml and repeated in every workflow. A
      # dtolnay/rust-toolchain step without a toolchain input gets its ref's default, stable.
      - name: One Rust toolchain
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "rust-toolchain.toml: $pin"
          [[ -n "$pin" ]]
          awk -v pin="$pin" '
            function end_step() {
              if (open && !pinned) { print step ": no toolchain input"; bad = 1 }
              open = 0
            }
            FNR == 1 { end_step() }
            /^ *- / { match($0, /^ */); if (open && RLENGTH <= indent) end_step() }
            /uses: dtolnay\/rust-toolchain@/ {
              end_step(); open = 1; pinned = 0; step = FILENAME ":" FNR
              match($0, /^ */); indent = RLENGTH
            }
            /^ *toolchain:/ {
              v = $0; sub(/^ *toolchain: */, "", v)
              if (v == pin) pinned = 1; else { print FILENAME ":" FNR ": toolchain " v; bad = 1 }
            }
            END { end_step(); exit bad }
          ' .github/workflows/*.yml .github/workflows/*.yaml || {
            echo "::error::every dtolnay/rust-toolchain step must pin rust-toolchain.toml's version"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Dependency advisories
        run: |
          cargo install --locked cargo-audit
          cargo audit

  release-scripts:
    name: Release scripts
    needs: changes
    if: needs.changes.outputs.release-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: Appcast tests
        run: uv run --no-project python -m unittest discover -s macos/release -v
      - name: Shell syntax
        run: for f in macos/build.sh macos/package-dmg.sh macos/release/*.sh; do bash -n "$f"; done

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build

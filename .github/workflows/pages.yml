name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'config.example.toml'
      - 'macos/release/appcast.py'
      - '.github/workflows/pages.yml'
  # Also started by release.yaml after it publishes a build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run build
        working-directory: docs
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Generate update feed when releases exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$REPO" --exclude-drafts --limit 1 --json tagName > "$RUNNER_TEMP/releases.json"
          if uv run --no-project python -c 'import json,sys; sys.exit(not bool(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/releases.json"; then
            uv run --no-project python macos/release/appcast.py --repo "$REPO" --output docs/dist/appcast.xml
          else
            echo 'No published releases. Publish documentation without an update feed.'
          fi
          touch docs/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5

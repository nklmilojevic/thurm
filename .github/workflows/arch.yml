name: Arch package

# Builds linux/arch/PKGBUILD (the AUR package) from the checkout in an Arch container and
# installs it, when something it builds or packages changes on main. A full release build, so
# pull requests run it only for changes to the packaging.
on:
  push:
    branches: [main]
    paths:
      - linux/**
      - scripts/linux/**
      - scripts/third-party-licenses.py
      - crates/**
      - vendor/**
      - shell-integration/**
      - skills/**
      - macos/Resources/fonts/**
      - nix/ghostty-zig-deps.nix
      - licenses/**
      - completions/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/arch.yml
  # On pull requests only when the packaging itself changes; code is covered by CI's tests.
  pull_request:
    paths:
      - linux/arch/**
      - scripts/linux/arch-package.sh
      - .github/workflows/arch.yml

permissions:
  contents: read

jobs:
  makepkg:
    name: makepkg (x86_64)
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      # git first: arch-package.sh packs the checkout's files with git ls-files.
      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rustup zig musl pkgconf curl python \
            gtk4 libadwaita fontconfig hicolor-icon-theme
          useradd -m builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The ghostty checkout and Zig's build cache, kept across runs (LIBGHOSTTY_VT_SYS_CACHE_DIR,
      # see vendor/libghostty-vt-sys/build.rs). Shared with the other Arch job; saved from main only.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: libghostty
        with:
          path: /var/cache/libghostty-vt
          key: libghostty-vt-arch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/libghostty-vt-sys/build.rs', 'rust-toolchain.toml') }}
      - name: makepkg
        run: |
          mkdir -p /var/cache/libghostty-vt
          chown -R builder "$GITHUB_WORKSPACE" /var/cache/libghostty-vt
          # makepkg refuses to run as root.
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder env LIBGHOSTTY_VT_SYS_CACHE_DIR=/var/cache/libghostty-vt \
            scripts/linux/arch-package.sh /tmp/arch
      - name: Install
        run: |
          pacman -U --noconfirm /tmp/arch/thurm-*.pkg.tar.zst
          if ldd /usr/bin/thurm-gtk | grep "not found"; then exit 1; fi
          thurm --version
          test -f /usr/share/thurm/icons/hicolor/scalable/actions/tab-new-symbolic.svg
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.libghostty.outputs.cache-hit != 'true'
        with:
          path: /var/cache/libghostty-vt
          key: ${{ steps.libghostty.outputs.cache-primary-key }}

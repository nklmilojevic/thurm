name: Nix

# The flake's package (`nix build .#thurm`), built when what it depends on changes.
on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, 'nix/**', Cargo.lock, 'vendor/**', .github/workflows/nix.yml]
  pull_request:
    paths: [flake.nix, flake.lock, 'nix/**', Cargo.lock, 'vendor/**', .github/workflows/nix.yml]

permissions:
  contents: read

jobs:
  build:
    name: Nix (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build
        run: nix build .#thurm -L --no-link

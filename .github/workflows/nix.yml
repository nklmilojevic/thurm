name: Nix

# The flake's package (`nix build .#thurm`), built on main when what it depends on changes, and
# on pull requests that change the flake, its Nix files or the locked dependencies. Builds on main
# go to the thurm Cachix cache: the dependencies (crane's derivation, until Cargo.lock changes)
# and the package, which flake users then download instead of compiling.
on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, 'nix/**', 'tailnet/**', Cargo.toml, Cargo.lock, 'crates/**', 'shell-integration/**', 'completions/**', rust-toolchain.toml, .github/workflows/nix.yml]
  pull_request:
    paths: [flake.nix, flake.lock, 'nix/**', 'tailnet/**', Cargo.lock, rust-toolchain.toml, .github/workflows/nix.yml]

permissions:
  contents: read

jobs:
  build:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # Reads the cache always; pushes what this run built from main only, when the token is set.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thurm
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' || env.CACHIX_AUTH_TOKEN == '' }}
      - name: Build
        run: nix build .#thurm -L --no-link

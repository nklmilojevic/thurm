name: Release

# Two update channels, one appcast (GitHub Pages):
#   tip      nightly, or on demand (Actions › Release › Run workflow, or `gh workflow run Release`):
#            the newest main commit that passed CI, as the rolling `tip` prerelease with
#            <sparkle:channel>tip. Skipped when `tip` is already there or only docs/CI changed.
#   release  a published GitHub release `vX.Y.Z` (gh release create vX.Y.Z): default channel
# Both build Apple silicon only, sign with Developer ID, notarize, and upload to the GitHub
# release. The build then starts pages.yml, which rebuilds the site (docs + appcast.xml from all releases, see
# macos/release/appcast.py). One-time setup: macos/release/setup-github.sh.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if tip is up to date or nothing in the app changed
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  actions: write # start pages.yml after publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan tip
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Pick the commit
        id: plan
        run: |
          set -euo pipefail
          SHA="$(gh run list --repo "$REPO" --workflow CI --branch main --event push --status success \
            --limit 1 --json headSha -q '.[0].headSha // empty')"
          if [[ -z "$SHA" ]]; then
            echo "::error::No commit on main has passed CI."
            exit 1
          fi
          HEAD="$(git rev-parse HEAD)"
          if [[ "$SHA" != "$HEAD" ]]; then
            echo "::notice::main is at ${HEAD:0:7}, which has not passed CI yet. Using ${SHA:0:7}."
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          TIP="$(git rev-parse -q --verify 'refs/tags/tip^{commit}' || true)"
          BUILD=true
          if [[ "$FORCE" != true && -n "$TIP" ]]; then
            if [[ "$TIP" == "$SHA" ]]; then
              echo "::notice::tip is already ${SHA:0:7}."
              BUILD=false
            elif git merge-base --is-ancestor "$TIP" "$SHA"; then
              # Files that never reach the app. This workflow itself still counts.
              APP="$(git diff --name-only "$TIP" "$SHA" \
                | grep -vE '^(docs/|\.github/|README\.md$|LICENSE|renovate\.json$|flake\.(nix|lock)$|\.envrc$|\.gitignore$)' || true)"
              if [[ -z "$APP" ]] && ! git diff --quiet "$TIP" "$SHA" -- .github/workflows/release.yaml; then
                APP=.github/workflows/release.yaml
              fi
              if [[ -z "$APP" ]]; then
                echo "::notice::Nothing in the app changed since tip (${TIP:0:7})."
                BUILD=false
              fi
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  linux:
    # thurm and thurmd for Linux remote hosts, with the build id the app gets, so the app can
    # install exactly its own build there (remote workspaces). Published by the build job,
    # which also compiles their SHA-256 into the app.
    name: Linux (${{ matrix.target }})
    needs: plan
    if: >-
      always()
      && ((github.event_name == 'release' && !github.event.release.prerelease)
        || (needs.plan.result == 'success' && needs.plan.outputs.build == 'true'))
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.plan.outputs.sha }}
          fetch-depth: 0 # the build number is the commit count
      - name: Build id
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          NUMBER="$(git rev-list --count HEAD)"
          # Same as macos/release/build-release.sh.
          if [[ "${{ github.event_name }}" == release ]]; then
            SHORT="$VERSION"
          else
            SHORT="$VERSION-tip.$(git rev-parse --short=7 HEAD)"
          fi
          BUILD="$SHORT+$NUMBER"
          echo "THURM_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "archive=thurm-${BUILD//+/-}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p thurm-cli -p thurm-daemon
      - name: Package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/linux"
          mkdir -p "$OUT"
          tar -czf "$OUT/${{ steps.meta.outputs.archive }}" -C "target/${{ matrix.target }}/release" thurm thurmd \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_LICENSES
          (cd "$OUT" && sha256sum "${{ steps.meta.outputs.archive }}" > "${{ steps.meta.outputs.archive }}.sha256")
          cat "$OUT"/*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: ${{ runner.temp }}/linux/*
          retention-days: 3

  build:
    name: Build (${{ github.event_name == 'release' && github.event.release.tag_name || 'tip' }})
    needs: [plan, linux]
    if: >-
      always()
      && needs.linux.result == 'success'
      && ((github.event_name == 'release' && !github.event.release.prerelease)
        || (needs.plan.result == 'success' && needs.plan.outputs.build == 'true'))
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      # One build per channel at a time, never cancelled halfway through an upload.
      group: release-build-${{ github.event_name == 'release' && github.event.release.tag_name || 'tip' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      THURM_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.plan.outputs.sha }}
          fetch-depth: 0 # the build number is the commit count

      - name: Channel and version
        id: meta
        env:
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
        run: |
          set -euo pipefail
          # The update feed compiled into the app: the variable, else this repository's GitHub
          # Pages appcast (github.event has no repository on scheduled runs).
          FEED="${SPARKLE_FEED_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/appcast.xml}"
          echo "THURM_FEED_URL=$FEED" >> "$GITHUB_ENV"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${{ github.event_name }}" == release ]]; then
            TAG="${{ github.event.release.tag_name }}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::Tag $TAG does not match the workspace version $VERSION in Cargo.toml. Bump it, merge, then tag v$VERSION."
              exit 1
            fi
            # Only a commit that passed CI on main is released (like tip builds).
            SHA="$(git rev-parse HEAD)"
            PASSED="$(gh run list --repo "$REPO" --workflow CI --commit "$SHA" --event push --status success \
              --limit 1 --json headSha -q '.[0].headSha // empty')"
            if [[ "$PASSED" != "$SHA" ]]; then
              echo "::error::$TAG points at ${SHA:0:7}, which has not passed CI on main. Tag a green commit (gh release create $TAG --target <sha>)."
              exit 1
            fi
            CHANNEL=release
          else
            TAG=tip
            CHANNEL=tip
          fi
          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_number=$(git rev-list --count HEAD)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the signing configuration
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAVE_NOTARY: ${{ secrets.NOTARY_API_KEY_P8 != '' }}
          HAVE_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [[ "$HAVE_CERT" == true ]] || missing+=(secret:MACOS_CERTIFICATE_P12)
          [[ "$HAVE_NOTARY" == true ]] || missing+=(secret:NOTARY_API_KEY_P8)
          [[ "$HAVE_SPARKLE" == true ]] || missing+=(secret:SPARKLE_PRIVATE_KEY)
          [[ -n "$THURM_SPARKLE_PUBLIC_KEY" ]] || missing+=(variable:SPARKLE_PUBLIC_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::Release signing is not configured: ${missing[*]} (see macos/release/setup-github.sh)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY_OVERRIDE: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          IDENTITY="$(macos/release/ci-keychain.sh create "$RUNNER_TEMP/thurm-signing.keychain-db")"
          IDENTITY="${IDENTITY_OVERRIDE:-$IDENTITY}"
          [[ -n "$IDENTITY" ]] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "THURM_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write the notarization and update keys
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed25519"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-ed25519" >> "$GITHUB_ENV"

      # Pinned: this job holds the signing keys and a release-write token.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: ${{ runner.temp }}/linux
          merge-multiple: true

      # The app installs these on Linux remote hosts and checks them against these sums.
      - name: Linux checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/linux"
          ls -l
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            SUM="$(cat ./*-"$t".tar.gz.sha256 | awk '{print $1}')"
            [[ ${#SUM} -eq 64 ]] || { echo "::error::no checksum for $t"; exit 1; }
            VAR="THURM_SHA256_$(echo "$t" | tr 'a-z-' 'A-Z_')"
            echo "$VAR=$SUM" >> "$GITHUB_ENV"
          done

      - name: Release notes
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          if [[ "${{ steps.meta.outputs.channel }}" == release ]]; then
            gh release view "${{ steps.meta.outputs.tag }}" --repo "$REPO" --json body -q .body > "$NOTES"
          else
            SHA="${{ steps.meta.outputs.sha }}"
            {
              echo "**Tip build** of [\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA)"
              echo
              git log -1 --format='%s%n%n%b' "$SHA"
            } > "$NOTES"
          fi
          echo "THURM_NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          THURM_VERSION: ${{ steps.meta.outputs.version }}
          THURM_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          THURM_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}
        run: macos/release/build-release.sh "${{ steps.meta.outputs.channel }}"

      - name: Publish the release assets
        if: steps.meta.outputs.channel == 'release'
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          cd macos/build/dist
          gh release upload "$TAG" --repo "$REPO" --clobber "$RUNNER_TEMP"/linux/thurm-*
          # Also as Thurm.dmg: releases/latest/download/Thurm.dmg is the stable download link.
          cp Thurm-*.dmg "$RUNNER_TEMP/Thurm.dmg"
          # sparkle.json last: the appcast only lists a release once it carries one.
          gh release upload "$TAG" --repo "$REPO" --clobber Thurm-*.dmg Thurm-*.zip "$RUNNER_TEMP/Thurm.dmg"
          gh release upload "$TAG" --repo "$REPO" --clobber sparkle.json

      - name: Publish the tip build
        if: steps.meta.outputs.channel == 'tip'
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.sha }}"
          # The `tip` tag follows main.
          if gh api "repos/$REPO/git/refs/tags/tip" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/tip" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/tip -f sha="$SHA" >/dev/null
          fi
          NOTES="$RUNNER_TEMP/tip-release.md"
          {
            echo "Nightly build of \`main\` at [\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA). Apple silicon, macOS 14 or later."
            echo
            echo "Download **Thurm-tip.dmg**, or choose *Thurm › Update Channel › Tip* in any Thurm to get these builds automatically."
          } > "$NOTES"
          if gh release view tip --repo "$REPO" >/dev/null 2>&1; then
            gh release edit tip --repo "$REPO" --title "Tip" --notes-file "$NOTES" --prerelease
          else
            gh release create tip --repo "$REPO" --verify-tag --prerelease --latest=false \
              --title "Tip" --notes-file "$NOTES"
          fi
          gh release upload tip --repo "$REPO" --clobber "$RUNNER_TEMP"/linux/thurm-*
          cd macos/build/dist
          gh release upload tip --repo "$REPO" --clobber Thurm-tip-*.zip Thurm-tip.dmg
          gh release upload tip --repo "$REPO" --clobber sparkle.json
          # Keep the three newest update archives (an app may still be downloading an older one).
          gh release view tip --repo "$REPO" --json assets -q '.assets[].name' \
            | { grep -E '^Thurm-tip-[0-9]+\.zip$' || true; } \
            | sort -t- -k3 -n -r | tail -n +4 \
            | while read -r old; do gh release delete-asset tip "$old" --repo "$REPO" --yes; done
          # And the 30 newest Linux builds per target: each tip app installs its own exact build on
          # remote hosts, so an app that hasn't updated for a while still finds it.
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh release view tip --repo "$REPO" --json assets -q '.assets[].name' \
              | { grep -E "^thurm-.*-[0-9]+-$t\.tar\.gz$" || true; } \
              | sed -E "s/^(.*-([0-9]+)-$t\.tar\.gz)$/\2 \1/" | sort -n -r | tail -n +31 | cut -d' ' -f2 \
              | while read -r old; do
                  gh release delete-asset tip "$old" --repo "$REPO" --yes
                  gh release delete-asset tip "$old.sha256" --repo "$REPO" --yes || true
                done
          done

      # Only after something was published, so a night without a build deploys nothing.
      - name: Update the site and feed
        run: gh workflow run pages.yml --repo "$REPO" --ref main

      - name: Remove signing material
        if: always()
        run: |
          macos/release/ci-keychain.sh delete "$RUNNER_TEMP/thurm-signing.keychain-db"
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle-ed25519"

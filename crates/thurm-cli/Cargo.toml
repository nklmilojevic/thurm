[package]
name = "thurm-cli"
description = "thurm: control Thurm panes from the command line (for humans and coding agents)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thurm"
path = "src/main.rs"

[dependencies]
thurm-proto.workspace = true
thurm-config.workspace = true
thurm-client.workspace = true
thurm-term.workspace = true
signal-hook.workspace = true
thurm-remote.workspace = true
clap.workspace = true
clap_complete.workspace = true
libc.workspace = true
serde_json.workspace = true
base64.workspace = true
qrcode.workspace = true

[dev-dependencies]
parking_lot.workspace = true
# The tailnet stand-ins (thurm-remote's tests/support/tailnet_fakes.rs).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

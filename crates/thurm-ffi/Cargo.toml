[package]
name = "thurm-ffi"
description = "C ABI bridge between the Thurm macOS app and the Rust core (see include/thurm.h)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "thurm_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
thurm-proto.workspace = true
thurm-config.workspace = true
thurm-client.workspace = true
thurm-term.workspace = true
thurm-remote = { workspace = true, optional = true }
thurm-ssh = { workspace = true, optional = true }
thurm-tailnet-client = { workspace = true, optional = true }
thurm-direct = { workspace = true, optional = true }
serde.workspace = true
# Grid locks are held across FFI calls as guards, possibly released on another thread.
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }
serde_json.workspace = true
log.workspace = true

[features]
default = ["desktop"]
# Remote workspaces over the system ssh (spawns processes; the macOS app).
desktop = ["dep:thurm-remote"]
# The iOS app: no process spawning, remote hosts over an in-process ssh transport, or over
# Tailscale to a daemon serving there, and hosts without Thurm over ssh or mosh.
mobile = ["dep:thurm-ssh", "dep:thurm-tailnet-client", "dep:thurm-direct"]

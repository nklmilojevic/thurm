[package]
name = "thurm-web"
description = "Thurm's browser client: the daemon protocol and a local terminal per pane, in wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thurm-proto.workspace = true
thurm-term.workspace = true
thurm-config.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ghostty-vt-rs-sys.workspace = true
# Exactly the dev shell's wasm-bindgen-cli (flake.nix): the two must match.
wasm-bindgen = "=0.2.129"

[package]
name = "thurm-mosh"
description = "A mosh client (the protocol only: SSP over UDP to mosh-server), for the iOS app's direct hosts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
base64.workspace = true
flate2.workspace = true
aes = { version = "0.9", default-features = false }
ocb3 = { version = "0.2", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

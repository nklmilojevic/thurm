# Thurm configuration. Every setting is optional; the values below are the defaults.
# Changes are picked up with "Reload Configuration" (⌘⇧,) or `thurm reload`.

# The updates Thurm has made to this file: it turns on features that came after the file was
# written, then raises this. Leave it as it is.
config_version = 9

[font]
# A family or a face name ("TX-02 Retina ExtraCondensed"). JetBrains Mono ships with Thurm.
family = "JetBrains Mono"
# Optional faces for styled text; derived from `family` when unset.
# Bold face.
# family_bold = "JetBrains Mono ExtraBold"
# Italic face.
# family_italic = "..."
# Bold italic face.
# family_bold_italic = "..."
# Font size in points.
size = 16.0
# Programming ligatures (=>, !=, ->, ...). Needs a font that ships them.
ligatures = true
# Extra OpenType features, e.g. ["ss01", "zero", "cv02"]. Prefix with "-" to disable.
features = []
# Line height multiplier.
line_height = 1.0
# Extra horizontal spacing in points.
letter_spacing = 0.0
# Thicker strokes (CoreText font smoothing), and how much: 0-255.
thicken = true
# How much to thicken: 0 (none) to 255 (CoreText's full smoothing).
thicken_strength = 255
# Fallback families tried before the system cascade list.
fallback = ["SF Mono", "Menlo"]
# Icons from the bundled Symbols Nerd Font when the font has none (Starship, lsd, eza...).
nerd_font_symbols = true

[window]
# Space around the cells, in points.
padding_x = 8.0
# Space above and below the cells, in points.
padding_y = 6.0
# Background opacity (0 to 1).
opacity = 1.0
# Blur what is behind the window when opacity < 1 (any value > 0 turns it on).
blur = 0
# The backdrop of the chrome when opacity < 1: "theme" (the terminal background), "system" (blur),
# "blend" (blur with the background over it) or "modern" (blur tinted as glass).
material = "theme"
# Treat Option as Alt/Meta: "none", "left", "right" or "both".
option_as_alt = "none"
# Initial size of new windows, in cells.
columns = 110
# Initial rows of new windows, in cells.
rows = 32
# Ask before closing a tab or window with a running process.
confirm_close = true
# Quit when the last window closes (like most macOS terminals, off: the app stays in the Dock).
quit_after_last_window = false
# Dim unfocused split panes (0 = off, 1 = fully).
unfocused_split_dim = 0.25
# Give the panes of a tab the same space again whenever one opens or closes (dragged dividers
# stay until then). View > Equalize Splits does it on demand.
auto_balance = true
# Show the per-pane header strip with agent status in splits.
pane_headers = true
# Space between split panes when pane headers show, in points.
pane_gap = 6.0
# Tabs: "native" (in the titlebar) or "sidebar" (vertical, grouped by repository). View > Tabs.
tab_style = "sidebar"
# Width of the tab sidebar in points.
sidebar_width = 240.0
# List every pane running an agent below the sidebar's tabs. View > Agents in Sidebar.
sidebar_agents = true
# Agents listed in the sidebar before its agents panel scrolls; drag the panel's header to change.
sidebar_agent_rows = 5

[cursor]
# Cursor shape: "block", "beam" or "underline".
style = "block"   # block | beam | underline
# Blink the cursor.
blink = false
# Beam and underline thickness in points.
thickness = 2.0

[colors]
# Built-in: thurm, thurm-light, tokyo-night, catppuccin-mocha, catppuccin-latte,
# gruvbox-dark, dracula, nord, solarized-dark, plus 600 more by name ("Catppuccin Frappe",
# "Rose Pine"...; `thurm theme` lists them). Or a path to a theme file (Thurm's TOML, or the
# `palette = N=#rrggbb` format those use).
# Follow the system appearance with "light:NAME,dark:NAME". View > Theme sets this too.
# theme = "thurm"
# theme = "light:catppuccin-latte,dark:catppuccin-mocha"
# Text color, "#rrggbb" (the theme's when unset).
# foreground = "#d6dde6"
# Background color, "#rrggbb" (the theme's when unset).
# background = "#0e1116"
# Cursor color, "#rrggbb" (the theme's when unset).
# cursor = "#9fb4c8"
# Text under the cursor, "#rrggbb" (the theme's when unset).
# cursor_text = "#0e1116"
# Selected text color, "#rrggbb" (the theme's when unset).
# selection_foreground = "#0e1116"
# Selection color, "#rrggbb" (the theme's when unset).
# selection_background = "#9fb4c8"
# Up to 16 ANSI palette colors, in order (black, red, green, ...).
# palette = ["#1b2029", "#e06c75", ...]
# Draw bold text with the bright palette variant.
bold_is_bright = false

[terminal]
# Scrollback lines kept per pane.
scrollback = 10000
# Command to run instead of the login shell, as a list of arguments.
# shell = ["/opt/homebrew/bin/fish", "-l"]
# `TERM` value exported to programs.
term = "xterm-256color"
# Inject shell integration (OSC 133 prompt marks, OSC 7 cwd) into zsh, bash and fish.
shell_integration = true
# What programs may do with the clipboard over OSC 52: "disabled", "copy", "paste" or "copy-paste".
osc52 = "copy"           # disabled | copy | paste | copy-paste
# Enable the kitty keyboard protocol.
kitty_keyboard = true
# Enable the kitty graphics protocol.
kitty_graphics = true
# Max memory for kitty graphics per pane, in MiB.
image_memory_mib = 320
# Characters that end a word for double-click selection.
word_separators = ",│`|:\"' ()[]{}<>\t"
# Copy to the clipboard as soon as a selection is made.
copy_on_select = false
# Lines scrolled per line of wheel/trackpad movement.
scroll_multiplier = 3.0
# Trackpad scrolling moves by fractions of a line (primary screen, no mouse reporting).
smooth_scroll = true
# Tab at a prompt opens Thurm's completion menu (needs shell integration); otherwise the
# shell's own completion runs.
tab_completion = true

# Variables for every shell and the programs it starts.
[terminal.env]
# EDITOR = "nvim"

[session]
# Keep layout, working directories and scrollback across app restarts and reboots.
persist = true
# Lines of scrollback per pane written to the snapshot.
scrollback_lines = 4000
# Seconds between snapshots of the session.
snapshot_interval_secs = 15
# "detach": quitting the app leaves shells running and reattaches next launch.
# "terminate": quitting kills the shells (layout and scrollback are still restored).
quit = "detach"
# Re-run an agent's resume command (e.g. `claude --continue`) when restoring after a reboot.
resume_agents = true
# Exit the daemon this many seconds after the last pane closed (0 = never).
daemon_idle_exit_secs = 0

[security]
# Enable Secure Keyboard Entry while a password prompt is detected (echo off).
auto_secure_input = true
# Show a lock badge in the pane while secure input is active.
secure_input_indicator = true
# Ask before pasting text containing newlines into a shell outside bracketed paste.
confirm_multiline_paste = true

[notifications]
# Turn all notifications on or off.
enabled = true
# Notify when a command running longer than this finishes in an unfocused pane (0 = off).
command_finished_secs = 15
# Honor OSC 9 / OSC 99 / OSC 777 notifications from programs.
program_notifications = true
# Count a bell in an unfocused pane on the Dock badge.
bell_badge = true
# What an agent does in each state: a tab indicator, a desktop notification (in an unfocused
# pane), a Dock badge (until seen) and a sound. States: working, waiting (needs input), blocked
# (asks for a permission), finished (ended a turn; needs `thurm hooks install`), failed, idle.
working = { tab_indicator = true, notify = false, badge = false, sound = "none" }
waiting = { tab_indicator = true, notify = true, badge = true, sound = "default" }
blocked = { tab_indicator = true, notify = true, badge = true, sound = "default" }
finished = { tab_indicator = true, notify = true, badge = true, sound = "default" }
failed = { tab_indicator = true, notify = true, badge = true, sound = "default" }
idle = { tab_indicator = true, notify = false, badge = false, sound = "none" }

[agents]
# Recognize agent CLIs (Claude Code, Codex...) in panes.
detect = true
# Milliseconds without output after which a working agent counts as idle.
idle_after_ms = 1500
# Name tabs after what the agent session is about (Claude Code's own session title, or the
# name given with /rename). Needs `thurm hooks install`.
session_titles = true
# Launch presets for the command palette (default: every detected agent CLI on PATH).
# presets = [{ name = "Claude (plan mode)", command = ["claude", "--permission-mode", "plan"] }]
# Add Thurm's status hooks to Claude Code's / Codex's settings when one is launched without
# them (what `thurm hooks install` does).
install_hooks = true

# Teach Thurm about another agent:
# [[agents.define]]
# kind = "mybot"
# name = "My Bot"
# processes = ["mybot"]
# working = ["esc to interrupt"]
# working_title = ["⠋", "⠙", "⠹"]   # title spinner frames: the title then decides
# attention = ["Approve?"]
# launch = ["mybot"]
# resume = ["mybot", "--continue"]

[programs]
# Show known programs (Neovim, Node, htop…) with an icon for their kind in pane headers and
# the sidebar.
detect = true
# Show the program's name in place of its process name in titles ("Neovim" for "nvim").
names = true

# Teach Thurm about another program, or override a built-in one by its id:
# [[programs.define]]
# id = "mytool"
# name = "My Tool"
# processes = ["mytool"]       # executable names; "python*" matches any suffix
# argv = ["mytool/cli.js"]     # parts of an interpreter's arguments (node mytool/cli.js)
# icon = "build"               # a kind of program, a mark, or on macOS an SF Symbol name
# color = "#3776ab"            # the sidebar tile's color (default: neutral)
# ink = "#ffffff"              # the icon's color on the tile
#   kinds: editor runtime git build container cluster database monitor multiplexer remote
#   files docs; marks: neovim vim sofka

[ai]
# Apple Intelligence's on-device model (macOS 26+, Apple silicon, Apple Intelligence turned
# on in System Settings). Nothing leaves the Mac. Off until enabled; the switches below pick
# the features.
enabled = false
# Name agent tabs after the task when the agent gives the session no title.
titles = true
# For agents without hooks: ask the model whether a quiet agent waits for an answer that no
# `attention` pattern caught.
status = true
# Say what an agent asks for, and sum up finished turns, in notifications and the switcher.
notifications = true
# Edit > Explain Last Command and `thurm explain`.
explain = true

[push]
# Agent notifications on paired iPhones and iPads go through this push relay (empty: off).
relay = ""
# The code the relay asks of new devices; Pair iPhone puts it in the pairing code.
code = ""

[tailscale]
# Serve the daemon over Tailscale as its own device on your tailnet, so your phone and other
# devices reach it at https://HOSTNAME.YOUR-TAILNET.ts.net without ssh. The first time, sign in
# with the link in Settings or `thurm tailscale status`.
enabled = false
# The device's name on the tailnet.
hostname = "thurm"
# Admit every member of the tailnet, not only the account that signed the device in.
allow_tailnet_members = false
# ACL tags to enroll with, e.g. ["tag:thurm"]. A tagged device has no owner, so this needs
# allow_tailnet_members.
advertise_tags = []
# A file holding a Tailscale auth key, to enroll without signing in in a browser.
auth_key_file = ""
# Also listen on this machine's tailnet addresses through its own Tailscale, e.g. ":7297".
host_listen = ""
# With host_listen: admit every caller Tailscale identifies, not only this machine's owner.
host_allow_identified = false
# Serve a socket for `tailscale serve` to proxy to as HTTP (`tailscale serve unix:<socket>`),
# which tells who the caller is. Needs Tailscale 1.94 or newer. A raw `--tcp` forward to it
# is refused: it would pass a caller's claimed identity through.
serve_socket = false

[updates]
# "release" (tagged releases), "tip" (a build of every commit to main), or "auto": the
# channel of the installed build. Also under Thurm > Update Channel.
channel = "auto"
# Look for updates in the background (hourly).
check_automatically = true
# Download updates in the background and install them when Thurm quits.
download_automatically = false

[quick_terminal]
# A terminal that slides in from a screen edge on a global shortcut, from any app or Space.
# Its shell keeps running while it is hidden. Also under Window > Quick Terminal.
# Shortcut, like "ctrl+grave" or "cmd+shift+t" (modifiers: cmd, ctrl, alt, shift); "" for none.
hotkey = ""
# "top", "bottom", "left", "right" or "center".
position = "top"
# Fraction of the screen it takes.
size = 0.4
# Hide it when another app or another Thurm window takes focus.
autohide = true
# Show it on the screen with the mouse pointer ("mouse") or with the menu bar ("main").
screen = "mouse"
# Slide animation in seconds (0 = none).
animation_duration = 0.2
# Background opacity (0..1), when it should differ from window.opacity.
# opacity = 0.9

# Key bindings on top of the defaults: "chord" = "action".
[keybindings]
# "cmd+shift+d" = "split_down"
# "cmd+d" = "split_right"

# Remote workspaces: thurmd on another machine (a Linux devbox, another Mac), reached with
# the system ssh and shown next to local panes. `thurm remote add devbox devbox` writes one.
# [[remote]]
# name = "devbox"          # shown in the sidebar; `thurm --remote devbox agents`
# host = "devbox"          # ssh target: a Host alias, user@host, or ssh://user@host:port
# socket = "/run/user/1000/thurm-1000/thurmd.sock"   # optional; discovered otherwise
# enabled = true
# clipboard_read = "ask"   # OSC 52 reads by remote programs: "ask", "always" or "never"
